name: Greenfield TalentIA
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
jobs:
  verificar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src/talentia tests/greenfield
      - run: python -m mypy src/talentia
      - run: python -m pytest -q tests/greenfield
        env:
          TALENTIA_ENV: pruebas
          TALENTIA_GREENFIELD_DATABASE_URL: sqlite:///./ci-greenfield.db
          TALENTIA_SESSION_SECRET: ci-secret-talentia-0123456789012345
          TALENTIA_ADMIN_EMAIL: admin@ci.test
          TALENTIA_ADMIN_PASSWORD: Contrasena-CI-TalentIA-2026!
