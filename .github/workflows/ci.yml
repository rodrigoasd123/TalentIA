name: CI TalentIA greenfield

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  verificar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,graph,benchmark]"
      - run: python -m pip check
      - run: python scripts/check_repository.py
      - run: python scripts/check_brand_identity.py
      - run: python -m ruff check src/talentia migrations_greenfield tests/greenfield scripts/seed_greenfield.py scripts/ejecutar_benchmark_greenfield.py
      - run: python -m ruff format --check src/talentia migrations_greenfield tests/greenfield scripts/seed_greenfield.py scripts/ejecutar_benchmark_greenfield.py
      - run: python -m mypy src/talentia
      - run: python -m alembic -c alembic_greenfield.ini upgrade head
        env:
          TALENTIA_GREENFIELD_DATABASE_URL: sqlite:///./ci-greenfield.db
      - run: python -m pytest -q tests/greenfield --basetemp .pytest-tmp
        env:
          TALENTIA_ENV: pruebas
          TALENTIA_GREENFIELD_DATABASE_URL: sqlite:///./ci-tests.db
          TALENTIA_SESSION_SECRET: ci-secret-talentia-0123456789012345
          TALENTIA_ADMIN_EMAIL: admin@ci.test
          TALENTIA_ADMIN_PASSWORD: Contrasena-CI-TalentIA-2026!
