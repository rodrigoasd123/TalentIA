name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: python scripts/check_repository.py
      - run: python scripts/check_brand_identity.py
      - run: ruff check src/talentia migrations_greenfield tests/greenfield scripts/ejecutar_benchmark_greenfield.py
      - run: ruff format --check src/talentia migrations_greenfield tests/greenfield scripts/ejecutar_benchmark_greenfield.py
      - run: mypy src/talentia
      - run: >-
          ruff check app/domain/imports.py app/infrastructure/imports
          app/infrastructure/repositories/import_repository.py
          app/application/use_cases/historical_import.py
          ats_frontend/views/imports.py
          tests/ats/test_historical_import.py migrations app/domain/ports.py
      - run: mypy --strict --ignore-missing-imports app/domain/imports.py
      - run: TALENTIA_DATABASE_URL=sqlite:///./ci-migration.db python -m alembic upgrade head
      - run: TALENTIA_GREENFIELD_DATABASE_URL=sqlite:///./ci-greenfield.db python -m alembic -c alembic_greenfield.ini upgrade head
      - run: python -m pytest -q --basetemp .pytest-tmp
