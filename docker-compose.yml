services:
  talentia:
    build: .
    environment:
      TALENTIA_ENV: piloto
      TALENTIA_GREENFIELD_DATABASE_URL: sqlite:////data/talentia.db
      TALENTIA_DOCUMENT_STORAGE: /data/documentos
      TALENTIA_SESSION_SECRET: ${TALENTIA_SESSION_SECRET:?configure TALENTIA_SESSION_SECRET}
      TALENTIA_ADMIN_EMAIL: ${TALENTIA_ADMIN_EMAIL:?configure TALENTIA_ADMIN_EMAIL}
      TALENTIA_ADMIN_PASSWORD: ${TALENTIA_ADMIN_PASSWORD:?configure TALENTIA_ADMIN_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - talentia-data:/data

volumes:
  talentia-data:
