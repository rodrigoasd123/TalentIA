[project]
name = "talentia"
version = "0.1.0"
description = "TalentIA — plataforma unificada de selección y análisis documental"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=2.0.30",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
    "alembic>=1.14.0",
    "jinja2>=3.1.4,<4.0.0",
    "pypdf>=4.3.0,<7.0.0",
]

[project.scripts]
talentia-web = "talentia.main:ejecutar"
talentia-worker = "talentia.platform.jobs.worker:ejecutar"

[project.optional-dependencies]
# Orquestacion opcional; el piloto usa el motor nativo cuando no esta instalada.
graph = ["langgraph>=0.2.0,<0.3.0"]
# Generación de los PDF ficticios de laboratorio.
fixtures = ["reportlab>=4.2.0"]
# Benchmark offline; no se instala ni inicia en el piloto.
benchmark = ["mlflow>=3.0.0,<4.0.0"]
dev = ["httpx>=0.27.0,<1.0.0", "pytest>=8.3.0", "pytest-cov>=5.0.0", "ruff>=0.6.0", "mypy>=1.11.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["talentia*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C90", "S", "RUF"]
ignore = ["S101", "S105", "S106"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/talentia"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/greenfield"]
pythonpath = ["src"]
markers = [
    "security: pruebas de seguridad que bloquean el merge",
    "integration: pruebas de integración",
]
