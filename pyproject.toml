[project]
name = "talentia"
version = "0.1.0"
description = "TalentIA — plataforma unificada de selección y análisis documental"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "passlib[argon2]>=1.7.4",
    "pyjwt>=2.9.0",
    "streamlit>=1.38.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "alembic>=1.14.0",
    "mlflow>=3.0.0,<4.0.0",
    "langgraph>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
# Orquestación de grafo. TalentIA funciona sin esto: cae al motor nativo incluido.
graph = ["langgraph>=0.2.0,<0.3.0", "langchain-core>=0.3.85,<1.0.0"]
# Extracción de texto de documentos reales.
documents = ["pypdf>=4.3.0", "python-docx>=1.1.0"]
# Generación de los PDF ficticios de laboratorio.
fixtures = ["reportlab>=4.2.0"]
# Integración con Gmail API.
gmail = ["google-auth>=2.34.0", "google-auth-oauthlib>=1.2.0", "google-api-python-client>=2.145.0"]
dev = ["pytest>=8.3.0", "pytest-cov>=5.0.0", "ruff>=0.6.0", "mypy>=1.11.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C90", "S", "RUF"]
ignore = ["S101", "S105", "S106"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app/domain", "app/ai"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "security: pruebas de seguridad que bloquean el merge",
    "integration: pruebas de integración",
]
