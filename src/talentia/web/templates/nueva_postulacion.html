{% extends "base.html" %}
{% block title %}Nueva postulacion | TalentIA{% endblock %}
{% block heading %}Crear postulacion{% endblock %}
{% block content %}
{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/postulaciones/nueva" class="seccion formulario-operativo">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="rejilla-formulario">
    <label>Cliente
      <select name="cliente_id" required>
        <option value="">Seleccione</option>
        {% for cliente in opciones.clientes %}<option value="{{ cliente.id }}" {% if datos.cliente_id == cliente.id %}selected{% endif %}>{{ cliente.codigo }} · {{ cliente.nombre }}</option>{% endfor %}
      </select>
    </label>
    <label>Persona candidata
      <select name="candidato_id" required>
        <option value="">Seleccione</option>
        {% for candidato in opciones.candidatos %}<option value="{{ candidato.id }}" {% if datos.candidato_id == candidato.id %}selected{% endif %} {% if candidato.en_proceso %}disabled{% endif %}>{{ candidato.nombre }} · {{ candidato.cliente_nombre }}{% if candidato.en_proceso %} (En proceso: {{ candidato.convocatoria_codigo }}){% endif %}</option>{% endfor %}
      </select>
    </label>
    {% if opciones.convocatorias %}
    <label>Convocatoria
      <select name="convocatoria_id" required>
        <option value="">Seleccione la convocatoria</option>
        {% set convocatoria_actual = datos.convocatoria_id or request.query_params.get('convocatoria_id', '') %}
        {% for convocatoria in opciones.convocatorias %}<option value="{{ convocatoria.id }}" {% if convocatoria_actual == convocatoria.id %}selected{% endif %}>{{ convocatoria.codigo }} · {{ convocatoria.perfil_titulo }} · {{ convocatoria.estado | title }}</option>{% endfor %}
      </select>
    </label>
    <input type="hidden" name="version_perfil_id" value="">
    {% else %}
    <label>Perfil publicado de compatibilidad
      <select name="version_perfil_id" required>
        <option value="">Seleccione</option>
        {% for version in opciones.versiones %}<option value="{{ version.id }}" {% if datos.version_perfil_id == version.id %}selected{% endif %}>{{ version.codigo }} · {{ version.titulo }} · v{{ version.numero }}</option>{% endfor %}
      </select>
    </label>
    <input type="hidden" name="convocatoria_id" value="">
    {% endif %}
    <label>Fuente
      <input name="fuente" maxlength="80" required value="{{ datos.fuente or 'directa' }}">
    </label>
  </div>
  <div class="acciones-formulario">
    <a class="btn btn-outline-secondary" href="/modulo/postulaciones">Cancelar</a>
    <button class="btn btn-primary" type="submit">Crear postulacion</button>
  </div>
</form>
{% endblock %}
