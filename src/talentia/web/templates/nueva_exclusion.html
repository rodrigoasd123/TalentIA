{% extends "base.html" %}
{% block title %}Crear reporte | TalentIA{% endblock %}
{% block heading %}Crear reporte de exclusiones{% endblock %}
{% block content %}<section class="seccion"><form method="post" class="row g-3"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="col-md-6"><label class="form-label">Cliente</label><select class="form-select" name="cliente_id" required>{% for cliente in usuario.clientes | sort %}<option value="{{ cliente }}">{{ cliente }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Estado a revisar</label><input class="form-control" name="estado" placeholder="Opcional"></div><div><button class="btn btn-primary" type="submit">Generar reporte</button></div></form></section>{% endblock %}
