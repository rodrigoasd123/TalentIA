code: VAC-004
title: Analista de Datos Junior
department: Datos y Analítica
location: Lima, Perú (híbrido)
employment_type: full_time
status: open
opening_date: "2026-09-05"
closing_date: "2026-10-20"
salary_min: 3500
salary_max: 4800
currency: PEN

description: >
  Puesto de entrada en el equipo de Analítica. Extracción y preparación de datos,
  construcción de informes y cuadros de mando, documentación de métricas y atención
  de solicitudes de análisis de las áreas de negocio. Se valora capacidad de
  aprendizaje y rigor por encima de trayectoria extensa.

requirements:
  version: 1
  minimum_score: 60.0
  # Margen amplio a propósito: los perfiles de inicio de carrera son heterogéneos
  # y una puntuación automática es menos informativa que en perfiles con recorrido.
  review_threshold: 8.0
  min_years_experience: 1.0
  education_level: tecnico

  mandatory_skills:
    - sql

  optional_skills:
    - power bi
    - tableau
    - pandas
    - numpy
    - excel
    - estadistica

  certifications: []
  languages: []

  hard_filters:
    - field: years_experience
      operator: gte
      value: 1
      label: Al menos 1 año de experiencia o prácticas acreditadas
      mandatory: true
      legal_basis: >
        Se requiere familiaridad previa con datos reales. Las prácticas
        profesionales computan como experiencia para no crear una barrera
        circular en un puesto de entrada.

    - field: skills
      operator: contains_all
      value: [sql]
      label: SQL acreditado
      mandatory: true
      legal_basis: Es la herramienta central del trabajo diario del puesto.

    - field: skills
      operator: contains_any
      value: [python, r, pandas]
      label: Python o R para análisis
      mandatory: true
      legal_basis: >
        Necesario para el tratamiento de datos más allá de la consulta. Se admite
        cualquiera de los dos lenguajes.

    - field: skills
      operator: contains_any
      value: [power bi, tableau, looker, excel]
      label: Herramienta de visualización
      mandatory: false
      legal_basis: Criterio valorable, no excluyente.

  weights:
    technical: 30
    education: 25
    projects: 25
    semantic: 20
